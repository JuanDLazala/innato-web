<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNATOec | Medio Digital Ecuatoriano</title>
    <meta name="description" content="Análisis político de Ecuador, Colombia y Perú. No competimos por la primicia, competimos por la interpretación.">
    <link rel="canonical" href="https://innatoec.com/">

    <!-- Iconos -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets_stable/favicon-32.png">
    <link rel="icon" type="image/png" sizes="512x512" href="assets_stable/favicon-512.png">
    <link rel="apple-touch-icon" href="assets_stable/apple-touch-icon.png">
    <meta name="theme-color" content="#BFEE00">

    <!-- Open Graph: WhatsApp, Facebook, LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="INNATOec">
    <meta property="og:locale" content="es_EC">
    <meta property="og:url" content="https://innatoec.com/">
    <meta property="og:title" content="INNATOec | Medio Digital Ecuatoriano">
    <meta property="og:description" content="Análisis político de Ecuador, Colombia y Perú. No competimos por la primicia, competimos por la interpretación.">
    <meta property="og:image" content="https://innatoec.com/assets_stable/og-innatoec.jpg">
    <meta property="og:image:secure_url" content="https://innatoec.com/assets_stable/og-innatoec.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="INNATOec — La verdad es innata.">

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="INNATOec | Medio Digital Ecuatoriano">
    <meta name="twitter:description" content="Análisis político de Ecuador, Colombia y Perú. No competimos por la primicia, competimos por la interpretación.">
    <meta name="twitter:image" content="https://innatoec.com/assets_stable/og-innatoec.jpg">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Newsreader', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        innato: {
                            lime: '#BFEE00',
                            alert: '#E11D48',
                            dark: '#0A0A0B',
                            surface: '#121214',
                            border: '#1F1F23',
                            muted: '#6B7280'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: oklch(12% 0.015 260);
            --surface: oklch(18% 0.02 260);
            --fg: oklch(98% 0.005 260);
            --muted: oklch(65% 0.01 260);
            --border: oklch(25% 0.02 260);
            --accent: #BFEE00;          /* lima: la marca */
            --alert: #E11D48;           /* rojo: solo urgencia */
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-display { font-family: 'Newsreader', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3BaseFilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/feTurbulence%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .hover-lift {
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            background-color: var(--surface);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .red-thread {
            position: relative;
        }
        .red-thread::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--accent);
            opacity: 0.4;
        }

        .video-aspect {
            aspect-ratio: 16 / 9;
        }
    </style>
</head>
<body>
    <div class="grain"></div>

    <!-- Formulario estatico: Netlify lo detecta al desplegar. El formulario visible lo renderiza React. -->
    <form name="newsletter" netlify netlify-honeypot="bot-field" hidden>
        <input type="email" name="email" />
        <input name="bot-field" />
    </form>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        const Icon = ({ name, size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {name === 'play' && <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" />}
                {name === 'arrow-right' && <path d="M5 12h14M12 5l7 7-7 7" />}
                {name === 'eye' && <React.Fragment><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></React.Fragment>}
                {name === 'radar' && <React.Fragment><circle cx="12" cy="12" r="2" /><path d="M12 19V5M5 12h14" /></React.Fragment>}
                {name === 'search' && <React.Fragment><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></React.Fragment>}
                {name === 'youtube' && <React.Fragment><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.14 1 12 1 12s0 3.86.42 5.58a2.78 2.78 0 0 0 1.94 2c1.71.42 8.6.42 8.6.42s6.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.86 23 12 23 12s0-3.86-.42-5.58z" /><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor" /></React.Fragment>}
                {name === 'instagram' && <React.Fragment><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></React.Fragment>}
                {name === 'tiktok' && <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5" />}
                {name === 'facebook' && <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />}
                {name === 'mail' && <React.Fragment><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><polyline points="22,6 12,13 2,6" /></React.Fragment>}
                {name === 'globe' && <React.Fragment><circle cx="12" cy="12" r="10" /><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /></React.Fragment>}
                {name === 'alert' && <React.Fragment><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" /><line x1="12" y1="9" x2="12" y2="13" /><line x1="12" y1="17" x2="12.01" y2="17" /></React.Fragment>}
                {name === 'mic' && <React.Fragment><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2" /><line x1="12" y1="19" x2="12" y2="23" /></React.Fragment>}
                {name === 'live' && <React.Fragment><circle cx="12" cy="12" r="3" fill="currentColor" /><path d="M7.76 16.24a6 6 0 0 1 0-8.49M16.24 7.76a6 6 0 0 1 0 8.49M4.93 19.07a10 10 0 0 1 0-14.14M19.07 4.93a10 10 0 0 1 0 14.14" /></React.Fragment>}
                {name === 'menu' && <React.Fragment><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="18" x2="21" y2="18" /></React.Fragment>}
                {name === 'x' && <React.Fragment><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></React.Fragment>}
            </svg>
        );

        const YOUTUBE_URL = 'https://www.youtube.com/@InnatoecOF';

        const scrollToId = (id) => {
            const el = document.getElementById(id);
            if (el) window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });
        };

        const Nav = () => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenu, setMobileMenu] = useState(false);
            const [active, setActive] = useState('inicio');

            const navLinks = [
                { id: 'inicio', label: 'Inicio' },
                { id: 'ultimo', label: 'Lo último' },
                { id: 'cobertura', label: 'Cobertura' },
                { id: 'blog', label: 'Blog' },
                { id: 'redes', label: 'Redes' },
                { id: 'manifiesto', label: 'Manifiesto' }
            ];

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 20);
                    const pos = window.scrollY + 120;
                    let current = 'inicio';
                    navLinks.forEach(l => {
                        const el = document.getElementById(l.id);
                        if (el && el.offsetTop <= pos) current = l.id;
                    });
                    setActive(current);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const go = (id) => { scrollToId(id); setMobileMenu(false); };

            return (
                <nav className={`fixed top-0 w-full z-[1000] transition-all duration-500 ${scrolled || mobileMenu ? 'bg-black/90 backdrop-blur-xl py-3 border-b border-white/10' : 'py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => go('inicio')}>
                            <img src="assets_stable/logotipo-ec.svg" alt="INNATOec" className="h-8 md:h-10" />
                        </div>

                        {/* Desktop Links */}
                        <div className="hidden lg:flex gap-8 text-[11px] font-mono uppercase tracking-[0.2em] text-white/50">
                            {navLinks.map(link => (
                                <button
                                    key={link.id}
                                    onClick={() => go(link.id)}
                                    className={`hover:text-white transition-colors ${active === link.id ? 'text-white red-thread' : ''}`}
                                >
                                    {link.label}
                                </button>
                            ))}
                        </div>

                        <div className="flex items-center gap-6">
                            <a href={YOUTUBE_URL} target="_blank" rel="noopener noreferrer" className="hidden md:flex items-center gap-2 text-[10px] font-mono uppercase tracking-widest text-innato-lime border border-innato-lime/30 px-4 py-2 hover:bg-innato-lime hover:text-white transition-all">
                                <span className="w-1.5 h-1.5 rounded-full bg-innato-lime animate-pulse"></span>
                                En Vivo
                            </a>
                            <button className="lg:hidden text-white" onClick={() => setMobileMenu(!mobileMenu)}>
                                <Icon name={mobileMenu ? 'x' : 'menu'} />
                            </button>
                        </div>
                    </div>

                    {/* Mobile Menu */}
                    {mobileMenu && (
                        <div className="lg:hidden absolute top-full left-0 w-full bg-black/95 backdrop-blur-2xl border-b border-white/10 p-8 flex flex-col gap-6 text-center">
                            {navLinks.map(link => (
                                <button
                                    key={link.id}
                                    onClick={() => go(link.id)}
                                    className={`text-xl font-display italic ${active === link.id ? 'text-innato-lime' : 'text-white'}`}
                                >
                                    {link.label}
                                </button>
                            ))}
                            <a href={YOUTUBE_URL} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-2 text-xs font-mono uppercase tracking-widest text-innato-lime mt-4">
                                <span className="w-2 h-2 rounded-full bg-innato-lime animate-pulse"></span>
                                Señal en vivo
                            </a>
                        </div>
                    )}
                </nav>
            );
        };

        const Tag = ({ children, className = "" }) => (
            <span className={`text-[10px] font-mono uppercase tracking-[0.2em] px-2 py-1 bg-white/5 border border-white/10 text-white/60 ${className}`}>
                {children}
            </span>
        );

        const Reveal = ({ children, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={ref} className={`reveal ${className}`}>{children}</div>;
        };

        // --- SECTIONS ---

        const HomeHero = () => (
            <section id="inicio" className="pt-32 pb-20 px-6 max-w-7xl mx-auto">
                <Reveal className="grid lg:grid-cols-12 gap-12 items-center">
                    <div className="lg:col-span-7">
                        <Tag className="mb-6 text-innato-lime border-innato-lime/20">Historia Destacada</Tag>
                        <h1 className="font-display text-5xl md:text-7xl lg:text-8xl leading-[0.9] font-light mb-8 tracking-tight">
                            La verdad es <span className="italic">innata.</span> <br/>
                            <span className="text-white/40">Y la claridad es poder.</span>
                        </h1>
                        <p className="max-w-xl text-lg text-white/60 font-light leading-relaxed mb-10">
                            No competimos por la primicia, competimos por la interpretación. Una plataforma para entender el Ecuador real, sin la propaganda que ensucia el debate público.
                        </p>
                        <div className="flex flex-wrap gap-4">
                            <button onClick={() => scrollToId('ultimo')} className="bg-white text-black px-8 py-4 font-mono text-[10px] uppercase tracking-[0.2em] hover:bg-innato-lime hover:text-black transition-all flex items-center gap-3">
                                <Icon name="play" size={14} /> Ver lo último
                            </button>
                            <button onClick={() => scrollToId('blog')} className="border border-white/20 text-white px-8 py-4 font-mono text-[10px] uppercase tracking-[0.2em] hover:bg-white/5 transition-all">
                                Leer el análisis
                            </button>
                        </div>
                    </div>
                    <div className="lg:col-span-5">
                        <div className="relative group cursor-pointer">
                            <div className="absolute -inset-4 bg-innato-lime/5 blur-3xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <img src="assets_stable/innato-hero.jpg" className="w-full aspect-[4/5] object-cover border border-white/10 transition-all duration-700" alt="INNATO" />
                            <div className="absolute bottom-6 left-6 right-6 p-6 bg-black/60 backdrop-blur-md border border-white/10">
                                <div className="text-[10px] font-mono text-innato-lime mb-2 tracking-[0.3em] uppercase">Portada</div>
                                <h3 className="font-display text-2xl mb-2 italic">"El sistema político está diseñado para el ruido, nosotros para la señal."</h3>
                                <div className="text-[10px] font-mono text-white/40 uppercase">Nico Armendáriz — Director</div>
                            </div>
                        </div>
                    </div>
                </Reveal>
            </section>
        );

        const LatestFeed = () => {
            const [feed, setFeed] = useState(null);
            const [error, setError] = useState(false);

            useEffect(() => {
                fetch('feed.json?ts=' + Date.now())
                    .then(r => r.ok ? r.json() : Promise.reject(r.status))
                    .then(setFeed)
                    .catch(() => setError(true));
            }, []);

            // Construir las 4 tarjetas a partir del JSON.
            // Orden fijo: TikTok, Instagram, Facebook, Blog (último post).
            const buildCards = () => {
                if (!feed) return [];
                const s = feed.social || {};
                const latestBlog = (feed.blog && feed.blog.length > 0) ? feed.blog[0] : null;
                return [
                    s.tiktok && { type: 'TikTok', platform: 'tiktok', title: s.tiktok.title, date: s.tiktok.date, img: s.tiktok.thumbnail, link: s.tiktok.url, external: true },
                    s.instagram && { type: 'Instagram', platform: 'instagram', title: s.instagram.title, date: s.instagram.date, img: s.instagram.thumbnail, link: s.instagram.url, external: true },
                    s.facebook && { type: 'Facebook', platform: 'facebook', title: s.facebook.title, date: s.facebook.date, img: s.facebook.thumbnail, link: s.facebook.url, external: true },
                    latestBlog
                        ? { type: 'Blog', platform: 'eye', title: latestBlog.title, date: latestBlog.date, img: latestBlog.thumbnail, link: 'blog/' + latestBlog.slug + '/', external: false }
                        : { type: 'Blog', platform: 'eye', title: 'Próximo análisis en preparación', date: 'Pronto', img: 'assets_stable/innato-hero.jpg', link: null, external: false, placeholder: true }
                ].filter(Boolean);
            };

            const cards = buildCards();

            return (
                <section id="ultimo" className="py-20 px-6 border-y border-white/5 bg-white/[0.01]">
                    <div className="max-w-7xl mx-auto">
                        <div className="flex justify-between items-end mb-12">
                            <div>
                                <Tag className="mb-4">Flujo Constante</Tag>
                                <h2 className="font-display text-4xl md:text-5xl">Lo último en INNATO</h2>
                            </div>
                            <a href="https://www.facebook.com/Innatoec" target="_blank" rel="noopener noreferrer" className="hidden md:flex items-center gap-2 font-mono text-[10px] uppercase tracking-widest text-white/40 hover:text-white transition-colors">
                                Ver todo el feed <Icon name="arrow-right" size={12} />
                            </a>
                        </div>

                        {error && (
                            <div className="text-white/30 font-mono text-xs uppercase tracking-widest text-center py-12">
                                No se pudo cargar el feed. Intentalo más tarde.
                            </div>
                        )}

                        {!feed && !error && (
                            <div className="text-white/20 font-mono text-xs uppercase tracking-widest text-center py-12">
                                Cargando últimas publicaciones…
                            </div>
                        )}

                        {feed && (
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {cards.map((post, i) => {
                                    const inner = (
                                        <React.Fragment>
                                            <div className="relative mb-6 -mx-6 -mt-6 aspect-video overflow-hidden">
                                                <img src={post.img} className="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-500" alt="" />
                                                <div className="absolute top-4 left-4 p-2 bg-black/60 backdrop-blur-md rounded text-white/60">
                                                    <Icon name={post.platform} size={14} />
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center mb-4">
                                                <Tag className="bg-transparent border-none p-0 text-white/30">{post.type}</Tag>
                                                <span className="text-[9px] font-mono text-white/20 uppercase tracking-widest">{post.date}</span>
                                            </div>
                                            <h3 className="font-display text-xl mb-6 group-hover:italic transition-all leading-snug">{post.title}</h3>
                                            <div className="flex items-center gap-2 text-[10px] font-mono uppercase tracking-widest text-white/20 group-hover:text-white transition-colors">
                                                {post.placeholder ? 'Próximamente' : 'Ver contenido'} <Icon name="arrow-right" size={12} />
                                            </div>
                                        </React.Fragment>
                                    );
                                    if (post.placeholder || !post.link) {
                                        return (
                                            <div key={i} className="group p-6 border border-white/5 bg-white/5 overflow-hidden block opacity-60">
                                                {inner}
                                            </div>
                                        );
                                    }
                                    if (post.external) {
                                        return (
                                            <a href={post.link} target="_blank" rel="noopener noreferrer" key={i} className="group p-6 border border-white/5 bg-white/5 hover-lift overflow-hidden block cursor-pointer">
                                                {inner}
                                            </a>
                                        );
                                    }
                                    return (
                                        <a href={post.link} key={i} className="group p-6 border border-white/5 bg-white/5 hover-lift overflow-hidden block cursor-pointer">
                                            {inner}
                                        </a>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const SocialIndex = () => (
            <section id="redes" className="py-24 px-6 max-w-7xl mx-auto">
                <Reveal className="text-center mb-16">
                    <h2 className="font-display text-4xl md:text-6xl mb-6 italic">La conversación también vive en redes</h2>
                    <p className="text-white/40 max-w-xl mx-auto font-light">Encontramos a nuestra audiencia donde ya está. Síguenos para el análisis diario en formato corto.</p>
                </Reveal>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8">
                    {[
                        { name: 'Facebook', followers: '129K', detail: 'Seguidores', icon: 'facebook', color: 'hover:border-blue-600/40', link: 'https://facebook.com/Innatoec' },
                        { name: 'TikTok', followers: '14K', detail: '225K likes', icon: 'tiktok', color: 'hover:border-white/40', link: 'https://tiktok.com/@innatoec' },
                        { name: 'Instagram', followers: '5.2K', detail: 'Seguidores', icon: 'instagram', color: 'hover:border-pink-500/40', link: 'https://instagram.com/innatoec' },
                        { name: 'YouTube', followers: '953', detail: 'Suscriptores', icon: 'youtube', color: 'hover:border-red-600/40', link: YOUTUBE_URL }
                    ].map((p, i) => (
                        <a href={p.link} target="_blank" rel="noopener noreferrer" key={i} className={`p-8 border border-white/10 text-center transition-all duration-500 cursor-pointer block group ${p.color}`}>
                            <div className="flex justify-center mb-6">
                                <Icon name={p.icon} size={32} className="text-white/20 group-hover:text-white transition-colors" />
                            </div>
                            <div className="text-2xl font-display mb-1">{p.followers}</div>
                            <div className="text-[10px] font-mono text-white/40 uppercase tracking-widest group-hover:text-white transition-colors">{p.detail}</div>
                            <div className="mt-4 text-[9px] font-mono text-innato-lime opacity-0 group-hover:opacity-100 transition-opacity uppercase tracking-widest">Seguir @innatoec</div>
                        </a>
                    ))}
                </div>
            </section>
        );

        const EditorialBlog = () => {
            const [posts, setPosts] = useState(null);
            const [open, setOpen] = useState(null);

            useEffect(() => {
                fetch('feed.json?ts=' + Date.now())
                    .then(r => r.ok ? r.json() : Promise.reject())
                    .then(d => setPosts(d.blog || []))
                    .catch(() => setPosts([]));
            }, []);

            const fmt = (iso) => {
                if (!iso) return '';
                const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
                const p = String(iso).split('-');
                if (p.length !== 3) return iso;
                return `${parseInt(p[2], 10)} de ${meses[parseInt(p[1], 10) - 1]}, ${p[0]}`;
            };

            return (
                <section id="blog" className="py-24 px-6 max-w-7xl mx-auto">
                    <div className="grid lg:grid-cols-4 gap-12">
                        <div className="lg:col-span-1">
                            <Tag className="mb-6">Criterio</Tag>
                            <h2 className="font-display text-4xl mb-8">El Blog Editorial</h2>
                            <p className="text-white/40 text-sm font-light leading-relaxed">
                                Análisis largo, firmado y fechado. Lo que no cabe en un video de sesenta segundos.
                            </p>
                        </div>

                        <div className="lg:col-span-3">
                            {posts === null && (
                                <div className="text-white/20 font-mono text-xs uppercase tracking-widest py-12">Cargando análisis…</div>
                            )}

                            {posts && posts.length === 0 && (
                                <div className="border border-white/10 border-dashed p-12 text-center">
                                    <div className="font-display text-2xl italic text-white/40 mb-3">Próximo análisis en preparación</div>
                                    <p className="text-white/25 text-sm font-light">El primer artículo editorial se publica pronto.</p>
                                </div>
                            )}

                            {posts && posts.length > 0 && (
                                <div className="grid md:grid-cols-2 gap-8">
                                    {posts.slice(0, 4).map((post, i) => (
                                        <a key={i} href={'blog/' + post.slug + '/'} className="block pb-8 border-b border-white/10 group">
                                            <div className="flex justify-between items-center mb-6">
                                                <Tag className="text-white/40 border-white/5 bg-transparent p-0">{post.category || 'Análisis'}</Tag>
                                                {post.readingTime && <span className="text-[9px] font-mono text-white/20">Lectura: {post.readingTime}</span>}
                                            </div>
                                            <h3 className="font-display text-2xl mb-4 group-hover:text-innato-lime transition-colors">{post.title}</h3>
                                            <p className="text-white/40 text-sm font-light leading-relaxed mb-6">{post.excerpt}</p>
                                            <div className="flex items-center justify-between mb-6">
                                                <span className="text-[10px] font-mono text-white/60 uppercase">{post.author || 'Redacción INNATOec'}</span>
                                                <span className="text-[10px] font-mono text-white/20 uppercase tracking-widest">{fmt(post.date)}</span>
                                            </div>
                                            <span className="flex items-center gap-2 text-[10px] font-mono uppercase tracking-widest text-white/40 group-hover:text-innato-lime transition-colors">
                                                Leer la nota <Icon name="arrow-right" size={12} />
                                            </span>
                                        </a>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </section>
            );
        };

        const CoverageGrid = () => (
            <section id="cobertura" className="py-24 px-6 bg-white/[0.02] border-y border-white/5">
                <div className="max-w-7xl mx-auto">
                    <div className="text-center mb-16">
                        <Tag className="mb-4">Qué cubrimos</Tag>
                        <h2 className="font-display text-5xl md:text-6xl italic mb-6">Nuestra cobertura</h2>
                        <p className="text-white/40 max-w-xl mx-auto font-light">Tres países, cuatro formatos. Cada pieza que publicamos entra por alguna de estas puertas.</p>
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {[
                            { name: 'INNATOec', icon: 'globe', desc: 'Política nacional, proceso electoral y poder local: Quito, Pichincha y la agenda del país.', link: 'https://www.tiktok.com/tag/ecuador' },
                            { name: 'INNATOco', icon: 'globe', desc: 'Congreso, partidos y coyuntura colombiana leída desde la región.', link: 'https://www.tiktok.com/tag/colombia' },
                            { name: 'INNATOpe', icon: 'globe', desc: 'La política peruana y su efecto sobre el equilibrio andino.', link: 'https://www.tiktok.com/tag/peru' },
                            { name: 'Entrevistas', icon: 'mic', desc: 'Conversaciones directas con candidatos, asambleístas, funcionarios y periodistas de investigación.', link: 'https://www.facebook.com/Innatoec' },
                            { name: '#URGENTE', icon: 'alert', desc: 'Hechos en desarrollo. Lo que hay que saber mientras todavía está pasando.', link: 'https://www.instagram.com/explore/tags/urgente/', alerta: true },
                            { name: 'En Vivo', icon: 'live', desc: 'Transmisiones y highlights de El Programa Ciudadano.', link: YOUTUBE_URL }
                        ].map((item, i) => (
                            <a
                                key={i}
                                href={item.link}
                                target="_blank"
                                rel="noopener noreferrer"
                                className={`block p-10 border ${item.alerta ? 'border-innato-alert/30 bg-innato-alert/5' : 'border-white/5 bg-white/5'} hover:border-white/20 hover-lift transition-all group`}
                            >
                                <div className="flex items-center gap-3 mb-4">
                                    <Icon name={item.icon} size={18} className="text-white/25 group-hover:text-innato-lime transition-colors" />
                                    <span className="text-2xl font-display italic group-hover:text-innato-lime transition-colors">{item.name}</span>
                                    {item.flag && <span className="text-lg">{item.flag}</span>}
                                </div>
                                <p className="text-sm font-light text-white/40 leading-relaxed mb-6">{item.desc}</p>
                                <span className="flex items-center gap-2 text-[9px] font-mono uppercase tracking-widest text-white/20 group-hover:text-white transition-colors">
                                    Ver publicaciones <Icon name="arrow-right" size={12} />
                                </span>
                            </a>
                        ))}
                    </div>
                </div>
            </section>
        );

        const Newsletter = () => {
            const [email, setEmail] = useState('');
            const [status, setStatus] = useState('idle');
            const sent = status === 'sent';

            const handleSubmit = (e) => {
                e.preventDefault();
                setStatus('sending');
                const body = new URLSearchParams({ 'form-name': 'newsletter', email }).toString();
                fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body
                })
                    .then(r => r.ok ? setStatus('sent') : setStatus('error'))
                    .catch(() => setStatus('error'));
            };

            return (
            <section className="py-24 px-6 bg-black relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-innato-lime to-transparent opacity-30"></div>
                <div className="max-w-3xl mx-auto text-center relative z-10">
                    <h2 className="font-display text-5xl md:text-7xl mb-8">Recibe criterio, <br/><span className="italic text-innato-lime">no ruido.</span></h2>
                    <p className="text-white/60 mb-12 font-light">
                        Déjanos tu correo y recibirás nuestro análisis editorial cuando lo publiquemos. Sin spam, solo contexto.
                    </p>

                    {sent ? (
                        <div className="border border-innato-lime/30 bg-innato-lime/5 px-8 py-10">
                            <div className="font-display text-3xl italic mb-3">Listo, quedaste dentro.</div>
                            <p className="text-white/50 text-sm font-light">Te escribiremos a <span className="text-white/80">{email}</span> cuando salga el próximo análisis.</p>
                        </div>
                    ) : (
                        <form
                            name="newsletter"
                            method="POST"
                            data-netlify="true"
                            netlify-honeypot="bot-field"
                            onSubmit={handleSubmit}
                        >
                            <input type="hidden" name="form-name" value="newsletter" />
                            <p className="hidden">
                                <label>No llenar: <input name="bot-field" onChange={() => {}} value="" /></label>
                            </p>
                            <div className="flex flex-col md:flex-row gap-4">
                                <input
                                    type="email"
                                    name="email"
                                    required
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    placeholder="Tu correo electrónico"
                                    className="flex-1 bg-white/5 border border-white/10 px-6 py-4 font-mono text-xs focus:outline-none focus:border-innato-lime transition-colors text-white"
                                />
                                <button type="submit" disabled={status === 'sending'} className="bg-innato-lime text-black px-10 py-4 font-mono text-[10px] uppercase tracking-widest hover:bg-white hover:text-black transition-all disabled:opacity-40">
                                    {status === 'sending' ? 'Enviando…' : 'Suscribirme'}
                                </button>
                            </div>
                            {status === 'error' && (
                                <p className="mt-4 text-[10px] font-mono text-innato-lime uppercase tracking-widest">No se pudo enviar. Intentalo de nuevo.</p>
                            )}
                        </form>
                    )}
                    <p className="mt-6 text-[10px] font-mono text-white/20 uppercase tracking-widest">Privacidad garantizada. Tu información es solo nuestra.</p>
                </div>
            </section>
            );
        };

        const Manifesto = () => (
            <section id="manifiesto" className="py-32 px-6 border-y border-white/5">
                <div className="max-w-4xl mx-auto text-center">
                    <h2 className="font-mono text-[10px] uppercase tracking-[0.5em] text-innato-lime mb-16 italic">Nuestro Manifiesto</h2>
                    <p className="font-display text-3xl md:text-5xl lg:text-6xl leading-tight font-light mb-16">
                        "INNATOec no compite por velocidad ni por tribus ideológicas. Competimos por <span className="italic border-b border-innato-lime/30 pb-2">claridad</span>. El enemigo no es un partido político; es la propaganda disfrazada de información."
                    </p>
                    <div className="flex justify-center">
                         <img src="assets_stable/isotipo.svg" alt="" className="h-12 opacity-25" />
                    </div>
                </div>
            </section>
        );

        const Footer = () => (
            <footer className="py-24 px-6 border-t border-white/5 bg-black">
                <div className="max-w-7xl mx-auto">
                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-16 mb-20">
                        <div className="lg:col-span-2">
                             <img src="assets_stable/logotipo-ec.svg" alt="INNATOec" className="h-10 mb-8" />
                             <p className="text-white/40 max-w-sm font-light leading-relaxed text-sm">
                                Medio digital ecuatoriano independiente operando en la intersección de la comunicación y el análisis político para una ciudadanía informada.
                             </p>
                        </div>
                        <div>
                            <h4 className="font-mono text-white text-[10px] uppercase tracking-[0.4em] mb-8">Navegación</h4>
                            <ul className="space-y-4 text-xs text-white/40 font-mono uppercase tracking-widest">
                                <li><button onClick={() => scrollToId('ultimo')} className="hover:text-innato-lime transition-colors uppercase">Lo último</button></li>
                                <li><button onClick={() => scrollToId('cobertura')} className="hover:text-innato-lime transition-colors uppercase">Cobertura</button></li>
                                <li><a href="blog/" className="hover:text-innato-lime transition-colors uppercase">Blog Editorial</a></li>
                                <li><button onClick={() => scrollToId('manifiesto')} className="hover:text-innato-lime transition-colors uppercase">Manifiesto</button></li>
                            </ul>
                        </div>
                        <div>
                            <h4 className="font-mono text-white text-[10px] uppercase tracking-[0.4em] mb-8">Contacto</h4>
                            <ul className="space-y-4 text-xs text-white/40 font-mono uppercase tracking-widest">
                                <li><a href="https://wa.me/593997862120" target="_blank" rel="noopener noreferrer" className="hover:text-innato-lime transition-colors">WhatsApp</a></li>
                                <li><a href="https://www.facebook.com/Innatoec" target="_blank" rel="noopener noreferrer" className="hover:text-innato-lime transition-colors">Messenger</a></li>
                                <li><a href="https://www.instagram.com/innatoec/" target="_blank" rel="noopener noreferrer" className="hover:text-innato-lime transition-colors">Instagram DM</a></li>
                            </ul>
                        </div>
                    </div>
                    <div className="pt-12 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="text-[10px] font-mono text-white/20 uppercase tracking-[0.2em]">© 2026 INNATOec | MEDIO DIGITAL INDEPENDIENTE.</div>
                        <div className="flex gap-8 text-[10px] font-mono text-white/30 uppercase tracking-widest">
                            <a href="https://tiktok.com/@innatoec" target="_blank" rel="noopener noreferrer" className="hover:text-white">TikTok</a>
                            <a href={YOUTUBE_URL} target="_blank" rel="noopener noreferrer" className="hover:text-white">YouTube</a>
                            <a href="https://instagram.com/innatoec" target="_blank" rel="noopener noreferrer" className="hover:text-white">Instagram</a>
                            <a href="https://facebook.com/Innatoec" target="_blank" rel="noopener noreferrer" className="hover:text-white">Facebook</a>
                        </div>
                    </div>
                </div>
            </footer>
        );

        // --- APP ---

        const App = () => (
            <div className="selection:bg-innato-lime selection:text-white">
                <Nav />
                <HomeHero />
                <LatestFeed />
                <CoverageGrid />
                <EditorialBlog />
                <SocialIndex />
                <Newsletter />
                <Manifesto />
                <Footer />
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
