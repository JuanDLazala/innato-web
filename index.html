<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNATO | Medio Digital Ecuatoriano</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['Newsreader', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        innato: {
                            red: '#E11D48',
                            dark: '#0A0A0B',
                            surface: '#121214',
                            border: '#1F1F23',
                            muted: '#6B7280'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: oklch(12% 0.015 260);
            --surface: oklch(18% 0.02 260);
            --fg: oklch(98% 0.005 260);
            --muted: oklch(65% 0.01 260);
            --border: oklch(25% 0.02 260);
            --accent: oklch(55% 0.22 25);
        }

        body {
            background-color: var(--bg);
            color: var(--fg);
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-display { font-family: 'Newsreader', serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .grain {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            opacity: 0.02;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3BaseFilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/feTurbulence%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .hover-lift {
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-4px);
            background-color: var(--surface);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        .red-thread {
            position: relative;
        }
        .red-thread::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 1px;
            background: var(--accent);
            opacity: 0.4;
        }

        .video-aspect {
            aspect-ratio: 16 / 9;
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        const Icon = ({ name, size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {name === 'play' && <polygon points="5 3 19 12 5 21 5 3" fill="currentColor" />}
                {name === 'arrow-right' && <path d="M5 12h14M12 5l7 7-7 7" />}
                {name === 'eye' && <React.Fragment><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /></React.Fragment>}
                {name === 'radar' && <React.Fragment><circle cx="12" cy="12" r="2" /><path d="M12 19V5M5 12h14" /></React.Fragment>}
                {name === 'search' && <React.Fragment><circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></React.Fragment>}
                {name === 'youtube' && <React.Fragment><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.42a2.78 2.78 0 0 0-1.94 2C1 8.14 1 12 1 12s0 3.86.42 5.58a2.78 2.78 0 0 0 1.94 2c1.71.42 8.6.42 8.6.42s6.88 0 8.6-.42a2.78 2.78 0 0 0 1.94-2C23 15.86 23 12 23 12s0-3.86-.42-5.58z" /><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor" /></React.Fragment>}
                {name === 'instagram' && <React.Fragment><rect x="2" y="2" width="20" height="20" rx="5" ry="5" /><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" /><line x1="17.5" y1="6.5" x2="17.51" y2="6.5" /></React.Fragment>}
                {name === 'tiktok' && <path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5" />}
                {name === 'facebook' && <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z" />}
                {name === 'mail' && <React.Fragment><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><polyline points="22,6 12,13 2,6" /></React.Fragment>}
                {name === 'menu' && <React.Fragment><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="18" x2="21" y2="18" /></React.Fragment>}
                {name === 'x' && <React.Fragment><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></React.Fragment>}
            </svg>
        );

        const Nav = ({ activeView, setView }) => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenu, setMobileMenu] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const navLinks = [
                { id: 'home', label: 'Inicio' },
                { id: 'videos', label: 'Videos' },
                { id: 'entrevistas', label: 'Entrevistas' },
                { id: 'blog', label: 'Blog' },
                { id: 'programas', label: 'Programas' },
                { id: 'nosotros', label: 'Nosotros' }
            ];

            return (
                <nav className={`fixed top-0 w-full z-[1000] transition-all duration-500 ${scrolled || mobileMenu ? 'bg-black/90 backdrop-blur-xl py-3 border-b border-white/10' : 'py-6'}`}>
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                            <img src="assets_stable/logo.jpg" alt="INNATO" className="h-8 md:h-10" />
                        </div>

                        {/* Desktop Links */}
                        <div className="hidden lg:flex gap-8 text-[11px] font-mono uppercase tracking-[0.2em] text-white/50">
                            {navLinks.map(link => (
                                <button 
                                    key={link.id}
                                    onClick={() => setView(link.id)}
                                    className={`hover:text-white transition-colors ${activeView === link.id ? 'text-white red-thread' : ''}`}
                                >
                                    {link.label}
                                </button>
                            ))}
                        </div>

                        <div className="flex items-center gap-6">
                            <button className="hidden md:flex items-center gap-2 text-[10px] font-mono uppercase tracking-widest text-innato-red border border-innato-red/30 px-4 py-2 hover:bg-innato-red hover:text-white transition-all">
                                <span className="w-1.5 h-1.5 rounded-full bg-innato-red animate-pulse"></span>
                                En Vivo
                            </button>
                            <button className="lg:hidden text-white" onClick={() => setMobileMenu(!mobileMenu)}>
                                <Icon name={mobileMenu ? 'x' : 'menu'} />
                            </button>
                        </div>
                    </div>

                    {/* Mobile Menu */}
                    {mobileMenu && (
                        <div className="lg:hidden absolute top-full left-0 w-full bg-black/95 backdrop-blur-2xl border-b border-white/10 p-8 flex flex-col gap-6 text-center">
                            {navLinks.map(link => (
                                <button 
                                    key={link.id}
                                    onClick={() => { setView(link.id); setMobileMenu(false); }}
                                    className={`text-xl font-display italic ${activeView === link.id ? 'text-innato-red' : 'text-white'}`}
                                >
                                    {link.label}
                                </button>
                            ))}
                            <button className="flex items-center justify-center gap-2 text-xs font-mono uppercase tracking-widest text-innato-red mt-4">
                                <span className="w-2 h-2 rounded-full bg-innato-red animate-pulse"></span>
                                Señal en vivo
                            </button>
                        </div>
                    )}
                </nav>
            );
        };

        const Tag = ({ children, className = "" }) => (
            <span className={`text-[10px] font-mono uppercase tracking-[0.2em] px-2 py-1 bg-white/5 border border-white/10 text-white/60 ${className}`}>
                {children}
            </span>
        );

        const Reveal = ({ children, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) entry.target.classList.add('active');
                }, { threshold: 0.1 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            return <div ref={ref} className={`reveal ${className}`}>{children}</div>;
        };

        // --- SECTIONS ---

        const HomeHero = () => (
            <section className="pt-32 pb-20 px-6 max-w-7xl mx-auto">
                <Reveal className="grid lg:grid-cols-12 gap-12 items-center">
                    <div className="lg:col-span-7">
                        <Tag className="mb-6 text-innato-red border-innato-red/20">Historia Destacada</Tag>
                        <h1 className="font-display text-5xl md:text-7xl lg:text-8xl leading-[0.9] font-light mb-8 tracking-tight">
                            La verdad es <span className="italic">innata.</span> <br/>
                            <span className="text-white/40">Y la claridad es poder.</span>
                        </h1>
                        <p className="max-w-xl text-lg text-white/60 font-light leading-relaxed mb-10">
                            No competimos por la primicia, competimos por la interpretación. Una plataforma para entender el Ecuador real, sin la propaganda que ensucia el debate público.
                        </p>
                        <div className="flex flex-wrap gap-4">
                            <button className="bg-white text-black px-8 py-4 font-mono text-[10px] uppercase tracking-[0.2em] hover:bg-innato-red hover:text-white transition-all flex items-center gap-3">
                                <Icon name="play" size={14} /> Ver Última Entrevista
                            </button>
                            <button className="border border-white/20 text-white px-8 py-4 font-mono text-[10px] uppercase tracking-[0.2em] hover:bg-white/5 transition-all">
                                Leer Análisis Semanal
                            </button>
                        </div>
                    </div>
                    <div className="lg:col-span-5">
                        <div className="relative group cursor-pointer">
                            <div className="absolute -inset-4 bg-innato-red/5 blur-3xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <img src="assets_stable/innato-hero.jpg" className="w-full aspect-[4/5] object-cover border border-white/10 transition-all duration-700" alt="INNATO" />
                            <div className="absolute bottom-6 left-6 right-6 p-6 bg-black/60 backdrop-blur-md border border-white/10">
                                <div className="text-[10px] font-mono text-innato-red mb-2 tracking-[0.3em] uppercase">Portada</div>
                                <h3 className="font-display text-2xl mb-2 italic">"El sistema político está diseñado para el ruido, nosotros para la señal."</h3>
                                <div className="text-[10px] font-mono text-white/40 uppercase">Nico Armendáriz — Director</div>
                            </div>
                        </div>
                    </div>
                </Reveal>
            </section>
        );

        const LatestFeed = () => {
            const [feed, setFeed] = useState(null);
            const [error, setError] = useState(false);

            useEffect(() => {
                fetch('feed.json?ts=' + Date.now())
                    .then(r => r.ok ? r.json() : Promise.reject(r.status))
                    .then(setFeed)
                    .catch(() => setError(true));
            }, []);

            // Construir las 4 tarjetas a partir del JSON.
            // Orden fijo: TikTok, Instagram, Facebook, Blog (último post).
            const buildCards = () => {
                if (!feed) return [];
                const s = feed.social || {};
                const latestBlog = (feed.blog && feed.blog.length > 0) ? feed.blog[0] : null;
                return [
                    s.tiktok && { type: 'TikTok', platform: 'tiktok', title: s.tiktok.title, date: s.tiktok.date, img: s.tiktok.thumbnail, link: s.tiktok.url, external: true },
                    s.instagram && { type: 'Instagram', platform: 'instagram', title: s.instagram.title, date: s.instagram.date, img: s.instagram.thumbnail, link: s.instagram.url, external: true },
                    s.facebook && { type: 'Facebook', platform: 'facebook', title: s.facebook.title, date: s.facebook.date, img: s.facebook.thumbnail, link: s.facebook.url, external: true },
                    latestBlog
                        ? { type: 'Blog', platform: 'eye', title: latestBlog.title, date: latestBlog.date, img: latestBlog.thumbnail, link: '#blog/' + latestBlog.slug, external: false }
                        : { type: 'Blog', platform: 'eye', title: 'Próximo análisis en preparación', date: 'Pronto', img: 'assets_stable/innato-hero.jpg', link: null, external: false, placeholder: true }
                ].filter(Boolean);
            };

            const cards = buildCards();

            return (
                <section className="py-20 px-6 border-y border-white/5 bg-white/[0.01]">
                    <div className="max-w-7xl mx-auto">
                        <div className="flex justify-between items-end mb-12">
                            <div>
                                <Tag className="mb-4">Flujo Constante</Tag>
                                <h2 className="font-display text-4xl md:text-5xl">Lo último en INNATO</h2>
                            </div>
                            <button className="hidden md:flex items-center gap-2 font-mono text-[10px] uppercase tracking-widest text-white/40 hover:text-white transition-colors">
                                Ver todo el feed <Icon name="arrow-right" size={12} />
                            </button>
                        </div>

                        {error && (
                            <div className="text-white/30 font-mono text-xs uppercase tracking-widest text-center py-12">
                                No se pudo cargar el feed. Intentalo más tarde.
                            </div>
                        )}

                        {!feed && !error && (
                            <div className="text-white/20 font-mono text-xs uppercase tracking-widest text-center py-12">
                                Cargando últimas publicaciones…
                            </div>
                        )}

                        {feed && (
                            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                                {cards.map((post, i) => {
                                    const inner = (
                                        <React.Fragment>
                                            <div className="relative mb-6 -mx-6 -mt-6 aspect-video overflow-hidden">
                                                <img src={post.img} className="w-full h-full object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-500" alt="" />
                                                <div className="absolute top-4 left-4 p-2 bg-black/60 backdrop-blur-md rounded text-white/60">
                                                    <Icon name={post.platform} size={14} />
                                                </div>
                                            </div>
                                            <div className="flex justify-between items-center mb-4">
                                                <Tag className="bg-transparent border-none p-0 text-white/30">{post.type}</Tag>
                                                <span className="text-[9px] font-mono text-white/20 uppercase tracking-widest">{post.date}</span>
                                            </div>
                                            <h3 className="font-display text-xl mb-6 group-hover:italic transition-all leading-snug">{post.title}</h3>
                                            <div className="flex items-center gap-2 text-[10px] font-mono uppercase tracking-widest text-white/20 group-hover:text-white transition-colors">
                                                {post.placeholder ? 'Próximamente' : 'Ver contenido'} <Icon name="arrow-right" size={12} />
                                            </div>
                                        </React.Fragment>
                                    );
                                    if (post.placeholder || !post.link) {
                                        return (
                                            <div key={i} className="group p-6 border border-white/5 bg-white/5 overflow-hidden block opacity-60">
                                                {inner}
                                            </div>
                                        );
                                    }
                                    if (post.external) {
                                        return (
                                            <a href={post.link} target="_blank" rel="noopener noreferrer" key={i} className="group p-6 border border-white/5 bg-white/5 hover-lift overflow-hidden block cursor-pointer">
                                                {inner}
                                            </a>
                                        );
                                    }
                                    return (
                                        <a href={post.link} key={i} className="group p-6 border border-white/5 bg-white/5 hover-lift overflow-hidden block cursor-pointer">
                                            {inner}
                                        </a>
                                    );
                                })}
                            </div>
                        )}
                    </div>
                </section>
            );
        };

        const SocialIndex = () => (
            <section className="py-24 px-6 max-w-7xl mx-auto">
                <Reveal className="text-center mb-16">
                    <h2 className="font-display text-4xl md:text-6xl mb-6 italic">La conversación también vive en redes</h2>
                    <p className="text-white/40 max-w-xl mx-auto font-light">Encontramos a nuestra audiencia donde ya está. Síguenos para el análisis diario en formato corto.</p>
                </Reveal>

                <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8">
                    {[
                        { name: 'TikTok', followers: '14K', detail: '224K likes', icon: 'tiktok', color: 'hover:border-white/40', link: 'https://tiktok.com/@innatoec' },
                        { name: 'Instagram', followers: '5K', detail: 'Seguidores', icon: 'instagram', color: 'hover:border-pink-500/40', link: 'https://instagram.com/innatoec' },
                        { name: 'Facebook', followers: '95K', detail: 'Seguidores', icon: 'facebook', color: 'hover:border-blue-600/40', link: 'https://facebook.com/Innatoec' },
                        { name: 'YouTube', followers: 'Canal', detail: 'Suscripciones', icon: 'youtube', color: 'hover:border-red-600/40', link: '#' }
                    ].map((p, i) => (
                        <a href={p.link} target="_blank" rel="noopener noreferrer" key={i} className={`p-8 border border-white/10 text-center transition-all duration-500 cursor-pointer block group ${p.color}`}>
                            <div className="flex justify-center mb-6">
                                <Icon name={p.icon} size={32} className="text-white/20 group-hover:text-white transition-colors" />
                            </div>
                            <div className="text-2xl font-display mb-1">{p.followers}</div>
                            <div className="text-[10px] font-mono text-white/40 uppercase tracking-widest group-hover:text-white transition-colors">{p.detail}</div>
                            <div className="mt-4 text-[9px] font-mono text-innato-red opacity-0 group-hover:opacity-100 transition-opacity uppercase tracking-widest">Seguir @innatoec</div>
                        </a>
                    ))}
                </div>
            </section>
        );

        const FeaturedInterviews = () => (
            <section className="py-24 px-6 bg-black border-y border-white/5">
                <div className="max-w-7xl mx-auto">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-16 gap-6">
                        <div>
                            <Tag className="mb-4 text-innato-red border-innato-red/20">Programación Original</Tag>
                            <h2 className="font-display text-4xl md:text-6xl">Entrevistas que importan</h2>
                        </div>
                        <p className="text-white/40 max-w-sm font-light text-sm">Conversaciones frontales con los actores que definen el rumbo del país. Sin filtros, sin guiones predecibles.</p>
                    </div>

                    <div className="grid lg:grid-cols-3 gap-8">
                        {/* Main Interview Card */}
                        <div className="lg:col-span-2 group cursor-pointer">
                            <div className="relative overflow-hidden border border-white/10">
                                <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent z-10"></div>
                                <div className="absolute top-6 left-6 z-20">
                                    <Tag className="bg-innato-red text-white border-none">En Portada</Tag>
                                </div>
                                <img src="assets_stable/social/feed-1.jpg" className="w-full aspect-video object-cover grayscale group-hover:grayscale-0 group-hover:scale-105 transition-all duration-700" alt="Entrevista" />
                                <div className="absolute bottom-8 left-8 right-8 z-20">
                                    <div className="flex items-center gap-4 mb-4">
                                        <div className="w-12 h-12 flex items-center justify-center bg-white text-black rounded-full group-hover:bg-innato-red group-hover:text-white transition-all">
                                            <Icon name="play" size={20} />
                                        </div>
                                        <div>
                                            <div className="text-[10px] font-mono text-white/60 uppercase tracking-widest">Duración: 42:15</div>
                                            <h3 className="font-display text-3xl md:text-4xl italic">Nico Armendáriz x Fiscal General</h3>
                                        </div>
                                    </div>
                                    <p className="text-white/60 text-sm font-light max-w-lg">Una conversación sobre la crisis institucional, el modelo de seguridad y lo que nadie se atreve a preguntar en televisión abierta.</p>
                                </div>
                            </div>
                        </div>

                        {/* Sidebar Interviews */}
                        <div className="space-y-6">
                            {[
                                { title: 'Análisis: El Futuro de la Energía', guest: 'Eco. Alberto Acosta', img: 'assets_stable/social/feed-2.jpg' },
                                { title: 'Conversando con el Ciudadano', guest: 'Nico Armendáriz', img: 'assets_stable/nico-main.jpg' },
                                { title: 'La Realidad de las Calles', guest: 'Reportaje Especial', img: 'assets_stable/social/feed-3.jpg' }
                            ].map((item, i) => (
                                <div key={i} className="flex gap-4 p-4 border border-white/5 hover:bg-white/5 transition-colors cursor-pointer group">
                                    <div className="w-24 h-24 flex-shrink-0 bg-white/5 border border-white/10 overflow-hidden relative">
                                        <img src={item.img} className="w-full h-full object-cover grayscale opacity-60 group-hover:opacity-100 transition-opacity" />
                                        <div className="absolute inset-0 flex items-center justify-center bg-black/40">
                                            <Icon name="play" size={14} className="text-white" />
                                        </div>
                                    </div>
                                    <div className="flex flex-col justify-center">
                                        <div className="text-[9px] font-mono text-innato-red mb-1 uppercase tracking-widest">Entrevista</div>
                                        <h4 className="font-display text-sm leading-tight mb-2">{item.title}</h4>
                                        <div className="text-[9px] font-mono text-white/30 uppercase">Invitado: {item.guest}</div>
                                    </div>
                                </div>
                            ))}
                            <button className="w-full py-4 border border-white/10 font-mono text-[10px] uppercase tracking-widest text-white/60 hover:text-white hover:bg-white/5 transition-all">
                                Ver todas las entrevistas
                            </button>
